services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cleanarch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
  
  server:
    image: server
    build:
      context: .
      dockerfile: WebApi/Dockerfile
    ports:
      - "8001:443"
      - "8000:80"
    environment:
      ASPNETCORE_HTTPS_PORTS: "8001"
      ASPNETCORE_URLS: "http://+;https://+"
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_Kestrel__Certificates__Default__Password: "YourCertificatePassword"
      ASPNETCORE_Kestrel__Certificates__Default__Path: "/https/app.pfx"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=cleanarch;Username=postgres;Password=postgres"
      Jwt__Key: "YourSuperSecretKeyThatIsAtLeast32CharactersLong!"
      Jwt__Issuer: "CleanArchitecture"
      Jwt__Audience: "CleanArchitectureUsers"
    volumes:
      - aspnet_https:/https/
      - ./logs:/app/logs
    depends_on:
      - db

volumes:
  pgdata:
  aspnet_https: